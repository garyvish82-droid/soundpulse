version: "3.9"

services:
  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: soundpulse
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      MCP_TRANSPORT: http
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Local demo API proxy
  demo-api:
    image: python:3.11-slim
    container_name: soundcloud-demo-api
    working_dir: /app
    volumes:
      - ..:/app
    command: >
      sh -c "pip install -q fastapi uvicorn anthropic &&
             uvicorn demo_api:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - mcp-server
